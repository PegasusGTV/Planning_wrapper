run_name: dit_2d_circle_delta
seed: 42
resume: null

data:
  train_path: /data/user_data/mbronars/packages/Planning_wrapper/demos/PushBoundary/circle_demos_full.npz  # .npz with keys "states" [N, T, D] and "actions" [N, T, A]
  val_path:   /data/user_data/mbronars/packages/Planning_wrapper/demos/PushBoundary/circle_demos_full.npz
  seq_len:    50               # T — total sequence length per training window
  batch_size: 512
  num_workers: 4
  stride: 1

model:
  state_dim: 4
  seq_len:   50
  dim:       256
  depth:     4
  heads:     8
  dropout:   0.1
  mlp_ratio: 4.0
  causal: true

ddim:
  num_train_timesteps: 1000
  beta_schedule:       squaredcos_cap_v2
  clip_sample:         true
  clip_sample_range:   1.0
  inference_steps:     50

train:
  steps:           500000
  lr:              3.0e-4
  weight_decay:    1.0e-2
  grad_clip:       1.0
  ema_decay:       0.999
  warmup_steps:    5000
  mixed_precision: "no"
  grad_accum:      1
  overfit_batches: -1

log:
  dir:          ./training_runs
  project:      dit_2d_new
  entity:       null
  every:        100
  val_every:    5000
  val_batches:  10
  save_every:   25000
  sample_every: 5000
  vis_n_samples:   4
  vis_use_T_block: false   # true if your block is T-shaped
  vis_every:       1       # subsample every N frames
  vis_ghost_alpha: 0.35
  vis_elev:        90.0
  vis_azim:        -90.0
  # Frames to treat as conditioning at inference time.
  # e.g. [0, 1] means frames 0 and 1 are held clean; the rest are generated.
  # Set to [] to do unconditional generation from pure noise.
  inference_cond_frames: [0, 1]
  vis_block_shape: circle