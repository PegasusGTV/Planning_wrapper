run_name: dit_2d_v1
seed: 42
resume: null

data:
  train_path: /Users/mbronars/workspace/CMU/Sp26/Planning/class_project/packages/Planning_wrapper/demos/PushBoundary/push_demos_1000.npz  # .npz with keys "states" [N, T, D] and "actions" [N, T, A]
  val_path:   /Users/mbronars/workspace/CMU/Sp26/Planning/class_project/packages/Planning_wrapper/demos/PushBoundary/push_demos_1000.npz
  seq_len:    100               # T — total sequence length per training window
  batch_size: 64
  num_workers: 4

model:
  state_dim:  18
  action_dim: 9
  seq_len:    100               # must match data.seq_len
  dim:        256
  depth:      6
  heads:      8
  dropout:    0.1
  mlp_ratio:  4.0
  causal:     false            # if true: frame j can only attend to frames 0..j

denoise_method: flow_matching  # "flow_matching" or "ddim"

flow_matching:
  num_train_timesteps: 1000
  shift:           1.0
  inference_steps: 25

ddim:
  num_train_timesteps: 1000
  beta_schedule:       squaredcos_cap_v2
  clip_sample:         true
  clip_sample_range:   2.0
  inference_steps:     50

train:
  steps:           200000
  lr:              1.0e-4
  weight_decay:    1.0e-3
  grad_clip:       1.0
  ema_decay:       0.9999
  mixed_precision: "no"
  grad_accum:      1
  overfit_batches: -1

log:
  dir:          ./training_runs
  project:      dit_2d_new
  entity:       null
  every:        100
  val_every:    1000
  val_batches:  10
  save_every:   10000
  sample_every: 5000
  # Frames to treat as conditioning at inference time.
  # e.g. [0, 1] means frames 0 and 1 are held clean; the rest are generated.
  # Set to [] to do unconditional generation from pure noise.
  inference_cond_frames: [0, 1]